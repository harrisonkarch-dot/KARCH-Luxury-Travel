  </defs>

  <circle cx="256" cy="256" r="232" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity=".8"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#7ea6c4" stroke-width="2" stroke-opacity=".18"/>

  <text
