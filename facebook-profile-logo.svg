<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KARCH Luxury Travel Concierge Facebook Profile Logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#12314a"/>
      <stop offset="55%" stop-color="#0d2235"/>
      <stop offset="100%" stop-color="#081624"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cc1dc"/>
      <stop offset="100%" stop-color="#4c738e"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef7fd"/>
      <stop offset="100%" stop-color="#8fb8d3"/>
